<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel2: #273449;
        --line: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --open: #ef4444;
        --progress: #f59e0b;
        --done: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header h1 { font-size: 17px; margin: 0; }
      header .paw { color: var(--accent); }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        background: var(--accent);
        color: #04293a;
        font-weight: 600;
      }
      button.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }
      .filters {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        flex-wrap: wrap;
      }
      select, input, textarea {
        font: inherit;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        width: 100%;
      }
      .filters select { width: auto; }
      .list { padding: 0 16px 40px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .card:hover { border-color: var(--accent); }
      .card .top { display: flex; justify-content: space-between; gap: 10px; }
      .card .id { color: var(--muted); font-size: 12px; }
      .card .summary { font-weight: 600; margin: 4px 0 8px; }
      .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
      .pill { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
      .pill.Open { background: rgba(239,68,68,.15); color: var(--open); }
      .pill.InProgress { background: rgba(245,158,11,.15); color: var(--progress); }
      .pill.Done { background: rgba(34,197,94,.15); color: var(--done); }

      /* Detail drawer */
      .overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.5);
        display: none; z-index: 10;
      }
      .overlay.show { display: block; }
      .drawer {
        position: fixed; top: 0; right: 0; height: 100%;
        width: 460px; max-width: 100%;
        background: var(--bg); border-left: 1px solid var(--line);
        transform: translateX(100%); transition: transform .2s ease;
        z-index: 11; overflow-y: auto;
      }
      .drawer.show { transform: translateX(0); }
      .drawer .body { padding: 18px; }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      .comment {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
        font-size: 13px; white-space: pre-wrap;
      }
      .imgprev { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-top: 6px; }
      .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
      .spinner { text-align: center; color: var(--muted); padding: 40px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="paw">🐾</span> Vital Paws — Task Desk</h1>
      <button onclick="openNew()">+ New Task</button>
    </header>

    <div class="filters">
      <select id="fStatus" onchange="render()">
        <option value="">All statuses</option>
      </select>
      <select id="fAssignee" onchange="render()">
        <option value="">All assignees</option>
      </select>
      <input id="fSearch" placeholder="Search…" oninput="render()" style="flex:1;min-width:140px" />
    </div>

    <div id="list" class="list">
      <div class="spinner">Loading tasks…</div>
    </div>

    <!-- Detail / edit drawer -->
    <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
      <header>
        <h1 id="dTitle">Task</h1>
        <button class="ghost" onclick="closeDrawer()">Close</button>
      </header>
      <div class="body" id="dBody"></div>
    </div>

    <script>
      var TASKS = [];
      var META = { statuses: [], priorities: [] };
      var current = null;

      function load() {
        google.script.run
          .withSuccessHandler(function (meta) {
            META = meta;
            fill('fStatus', META.statuses, 'All statuses');
          })
          .apiGetMeta();
        google.script.run
          .withSuccessHandler(function (tasks) {
            TASKS = tasks || [];
            buildAssigneeFilter();
            render();
          })
          .withFailureHandler(function (e) {
            document.getElementById('list').innerHTML =
              '<div class="empty">Could not load: ' + e.message + '</div>';
          })
          .apiGetTasks();
      }

      function fill(id, items, allLabel) {
        var sel = document.getElementById(id);
        sel.innerHTML = '<option value="">' + allLabel + '</option>';
        items.forEach(function (x) {
          var o = document.createElement('option');
          o.value = x; o.textContent = x; sel.appendChild(o);
        });
      }

      function buildAssigneeFilter() {
        var names = {};
        TASKS.forEach(function (t) { if (t.assignee) names[t.assignee] = 1; });
        fill('fAssignee', Object.keys(names), 'All assignees');
      }

      function statusClass(s) { return (s || 'Open').replace(/ /g, ''); }

      function render() {
        var fs = document.getElementById('fStatus').value;
        var fa = document.getElementById('fAssignee').value;
        var q = document.getElementById('fSearch').value.toLowerCase();
        var list = document.getElementById('list');

        var rows = TASKS.filter(function (t) {
          if (fs && t.status !== fs) return false;
          if (fa && t.assignee !== fa) return false;
          if (q && (t.summary + ' ' + t.id).toLowerCase().indexOf(q) < 0) return false;
          return true;
        });

        if (!rows.length) {
          list.innerHTML = '<div class="empty">No tasks. Create one in Slack or hit “+ New Task”.</div>';
          return;
        }

        list.innerHTML = rows
          .map(function (t) {
            var hasLink = t.link ? ' 🔗' : '';
            var hasImg = t.image ? ' 🖼️' : '';
            var nComments = t.comments ? t.comments.split('\n').filter(Boolean).length : 0;
            return (
              '<div class="card" onclick="openTask(\'' + t.id + '\')">' +
                '<div class="top">' +
                  '<span class="id">' + t.id + '</span>' +
                  '<span class="pill ' + statusClass(t.status) + '">' + (t.status || 'Open') + '</span>' +
                '</div>' +
                '<div class="summary">' + esc(t.summary) + '</div>' +
                '<div class="meta">' +
                  '<span>👤 ' + (esc(t.assignee) || 'Unassigned') + '</span>' +
                  '<span>⚑ ' + (t.priority || '—') + '</span>' +
                  '<span>💬 ' + nComments + hasLink + hasImg + '</span>' +
                '</div>' +
              '</div>'
            );
          })
          .join('');
      }

      function openTask(id) {
        current = TASKS.filter(function (t) { return t.id === id; })[0];
        if (!current) return;
        document.getElementById('dTitle').textContent = current.id;
        var t = current;
        var comments = (t.comments || '')
          .split('\n').filter(Boolean)
          .map(function (c) { return '<div class="comment">' + esc(c) + '</div>'; })
          .join('') || '<div style="color:var(--muted);font-size:13px">No comments yet.</div>';

        document.getElementById('dBody').innerHTML =
          field('Summary', textarea('d_summary', t.summary)) +
          '<div class="row">' +
            field('Status', selectEl('d_status', META.statuses, t.status)) +
            field('Priority', selectEl('d_priority', META.priorities, t.priority)) +
          '</div>' +
          field('Assignee', inputEl('d_assignee', t.assignee)) +
          field('Link', inputEl('d_link', t.link)) +
          field('Image URL', inputEl('d_image', t.image)) +
          (t.image ? '<img class="imgprev" src="' + esc(t.image) + '" />' : '') +
          '<div style="margin:6px 0 16px"><button onclick="saveTask()">Save changes</button></div>' +
          '<div class="field"><label>Comments</label>' + comments + '</div>' +
          field('Add comment', inputEl('d_comment', '')) +
          '<div class="row">' +
            inputEl('d_author', '') +
            '<button onclick="addComment()">Comment</button>' +
          '</div>';
        showDrawer();
      }

      function saveTask() {
        var fields = {
          summary: gv('d_summary'),
          status: gv('d_status'),
          priority: gv('d_priority'),
          assignee: gv('d_assignee'),
          link: gv('d_link'),
          image: gv('d_image'),
        };
        google.script.run
          .withSuccessHandler(function () { closeDrawer(); load(); })
          .apiUpdateTask(current.id, fields);
      }

      function addComment() {
        var text = gv('d_comment');
        if (!text) return;
        google.script.run
          .withSuccessHandler(function () {
            var id = current.id;
            load();
            setTimeout(function () { openTask(id); }, 400);
          })
          .apiAddComment(current.id, gv('d_author') || 'Someone', text);
      }

      // ---- New task ----
      function openNew() {
        document.getElementById('dTitle').textContent = 'New Task';
        document.getElementById('dBody').innerHTML =
          field('Summary', textarea('n_summary', '')) +
          '<div class="row">' +
            field('Priority', selectEl('n_priority', META.priorities, 'Medium')) +
            field('Assignee', inputEl('n_assignee', '')) +
          '</div>' +
          field('Link', inputEl('n_link', '')) +
          field('Image URL', inputEl('n_image', '')) +
          field('Created by', inputEl('n_createdby', '')) +
          '<button onclick="createTask()">Create task</button>';
        showDrawer();
      }

      function createTask() {
        var task = {
          summary: gv('n_summary'),
          priority: gv('n_priority'),
          assignee: gv('n_assignee'),
          link: gv('n_link'),
          image: gv('n_image'),
          createdBy: gv('n_createdby'),
        };
        if (!task.summary) { alert('Summary is required'); return; }
        google.script.run
          .withSuccessHandler(function () { closeDrawer(); load(); })
          .apiAddTask(task);
      }

      // ---- helpers ----
      function field(label, inner) {
        return '<div class="field"><label>' + label + '</label>' + inner + '</div>';
      }
      function inputEl(id, val) { return '<input id="' + id + '" value="' + esc(val || '') + '" />'; }
      function textarea(id, val) { return '<textarea id="' + id + '" rows="2">' + esc(val || '') + '</textarea>'; }
      function selectEl(id, items, val) {
        return '<select id="' + id + '">' +
          items.map(function (x) {
            return '<option value="' + x + '"' + (x === val ? ' selected' : '') + '>' + x + '</option>';
          }).join('') + '</select>';
      }
      function gv(id) { var el = document.getElementById(id); return el ? el.value : ''; }
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function showDrawer() {
        document.getElementById('overlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
      }
      function closeDrawer() {
        document.getElementById('overlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
      }

      load();
    </script>
  </body>
</html>
